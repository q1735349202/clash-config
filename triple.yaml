# ==========================================================
# Clash 配置 —— 澳洲 悉尼 AWS Lightsail（双协议）
# 2026-11-19 生成：WS(TCP 443) + Hysteria2(UDP 443) 并存
# ==========================================================

# —— 本机代理端口 ——
mixed-port: 7890

# —— 是否允许局域网其他设备连你这台手机 ——
allow-lan: false

bind-address: '*'

# —— 运行模式：rule = 按规则分流 ——
mode: rule

# —— 日志级别 ——
log-level: info

# —— 关闭 IPv6 ——
ipv6: false

# ==========================================================
# DNS
# ==========================================================
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  fallback:
    - 8.8.8.8
    - 1.1.1.1

  fallback-filter:
    geoip: false


# ==========================================================
# 节点列表
# ==========================================================
proxies:
  # ========== 澳洲 悉尼 WS（TCP 443）==========
  - name: "悉尼 WS"
    type: vless
    server: 3.104.221.230
    port: 443
    uuid: 96f3c7e4-ca8a-47d5-8983-b80278ca4ca8
    network: ws
    tls: true
    udp: true
    servername: 3.104.221.230
    # 裸 IP 用自签证书，必须跳过校验
    skip-cert-verify: true
    client-fingerprint: chrome
    ws-opts:
      path: "/02afc9c8b48c0ff762532c41777e8a18"
      headers:
        Host: 3.104.221.230

  # ========== 澳洲 悉尼 Hysteria2（UDP 443）==========
  # 不填 up/down → 走 BBR 模式（保守，不主动满速）
  # 若要试 Brutal 模式，取消下面两行注释并填实际带宽
  - name: "悉尼 Hy2"
    type: hysteria2
    server: 3.104.221.230
    port: 443
    password: Hy2Sydney2026mK9vQz4Xw
    sni: 3.104.221.230
    # 自签证书，必须跳过校验
    skip-cert-verify: true
    # up: "50 Mbps"
    # down: "200 Mbps"


# ==========================================================
# 节点分组
# ==========================================================
proxy-groups:
  # 手动切换：用来做 WS vs Hy2 的 A/B 对照
  - name: "节点选择"
    type: select
    proxies:
      - "悉尼 WS"
      - "悉尼 Hy2"
      - DIRECT

  # 自动测延迟选最快（注意：延迟不等于带宽，测速请用「节点选择」手动切）
  - name: "自动选最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "悉尼 WS"
      - "悉尼 Hy2"


# ==========================================================
# 分流规则
# ==========================================================
rules:
  # 抖音 → 直连（海外 IP 会被风控，绝对不能走节点）
  - DOMAIN-SUFFIX,douyin.com,DIRECT
  - DOMAIN-SUFFIX,iesdouyin.com,DIRECT
  - DOMAIN-SUFFIX,amemv.com,DIRECT
  - DOMAIN-SUFFIX,douyinpic.com,DIRECT
  - DOMAIN-SUFFIX,douyinvod.com,DIRECT
  - DOMAIN-SUFFIX,bytedance.com,DIRECT

  # 微信、QQ → 直连
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,tencent.com,DIRECT

  # 国内常用服务 → 直连
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-SUFFIX,aliyun.com,DIRECT
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,jd.com,DIRECT
  - DOMAIN-SUFFIX,bilibili.com,DIRECT

  # 节点自己的 IP 必须直连（否则会绕回来死循环）
  - IP-CIDR,3.104.221.230/32,DIRECT,no-resolve

  # 国内 IP → 直连
  - GEOIP,CN,DIRECT,no-resolve

  # 其余全部走节点
  - MATCH,节点选择
